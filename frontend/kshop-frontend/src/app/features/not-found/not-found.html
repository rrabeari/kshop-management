<div class="not-found-page">

  <div class="not-found-card">

    <div class="not-found-icon">
      🔎
    </div>

    <div class="not-found-code">
      404
    </div>

    <h1>
      Page introuvable
    </h1>

    <p>
      Désolé, la page que vous recherchez
      n'existe pas ou a été déplacée.
    </p>

    <p class="help-text">
      Vérifiez l'adresse ou retournez au tableau de bord.
    </p>

    <div class="actions">

      <button
        type="button"
        class="btn-secondary"
        (click)="goBack()">

        ← Retour

      </button>

      <button
        type="button"
        class="btn-primary"
        (click)="goToDashboard()">

        Tableau de bord

      </button>

    </div>

  </div>

</div>
